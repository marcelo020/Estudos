<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dossiês do sandbox</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script>(function(){var t;try{t=localStorage.getItem("tema")}catch(e){}if(!t)t=matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light";document.documentElement.dataset.theme=t})()</script>
<style>
:root{--bg:#F4F6FB;--panel:#fff;--ink:#0F1733;--mute:#5B6584;--line:#D9DEEE;--acc:#1A3DFF;--accbg:#E4E9FF;--warn:#FFF4CC;--onacc:#fff;--n1:#E31E24;--n2:#F5A300;--n3:#FFD100;--n4:#008A1E;--n5:#006B2B;--t1:#fff;--t2:#1B1B1B;--t3:#1B1B1B;--t4:#fff;--t5:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="dark"]{--bg:#0B1020;--panel:#141B33;--ink:#EAEEFF;--mute:#98A2C6;--line:#263054;--acc:#7F95FF;--accbg:#1E2A5E;--warn:#332E12;--onacc:#0B1020;--n1:#FF6B70;--n2:#FFB733;--n3:#FFDB4D;--n4:#4FD67E;--n5:#22B85C;--t1:#0B1020;--t2:#0B1020;--t3:#0B1020;--t4:#0B1020;--t5:#0B1020}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 'Public Sans',system-ui,sans-serif}
h1,h2,h3{font-family:'Bricolage Grotesque','Public Sans',system-ui,sans-serif;margin:0;line-height:1.2}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
header{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:14px 20px;background:var(--panel);border-bottom:1px solid var(--line)}
header h1{font-size:20px;flex:1;min-width:180px}
#st{font-size:13px;color:var(--mute)}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 12px}
.btn:hover{border-color:var(--acc)}
.btn.on,.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--onacc)}
.btn.danger{color:var(--n1)}
.wrap{display:grid;grid-template-columns:260px 1fr;gap:20px;padding:20px;max-width:1200px;margin:0 auto}
aside{display:flex;flex-direction:column;gap:8px;align-self:start}
.pi{display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:left;width:100%;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:10px 12px}
.pi.sel{border-color:var(--acc);box-shadow:inset 3px 0 0 var(--acc)}
.chip{display:inline-block;min-width:26px;text-align:center;border-radius:6px;padding:1px 7px;font-weight:600;font-size:13px;color:#fff;background:var(--mute)}
.chip[data-n="1"]{background:var(--n1);color:var(--t1)}.chip[data-n="2"]{background:var(--n2);color:var(--t2)}.chip[data-n="3"]{background:var(--n3);color:var(--t3)}.chip[data-n="4"]{background:var(--n4);color:var(--t4)}.chip[data-n="5"]{background:var(--n5);color:var(--t5)}
main{display:flex;flex-direction:column;gap:20px;min-width:0}
section{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px}
section>h2{font-size:18px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.f{display:flex;flex-direction:column;gap:4px}
.f.w{grid-column:1/-1}
.f b{font-weight:600;font-size:14px}
.f small{color:var(--mute)}
.f p{margin:0;white-space:pre-wrap;max-width:70ch}
.f p i{color:var(--mute)}
input,textarea,select{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
textarea{resize:vertical}
.name{font-family:'Bricolage Grotesque',system-ui,sans-serif;font-size:26px;font-weight:700;background:transparent;border-color:transparent;padding:2px 0}
.name:hover,.name:focus{border-color:var(--line);padding:2px 8px}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 12px}
.opt.on{border-color:var(--acc);background:var(--accbg);font-weight:600}
.opt[data-n].on{border-color:transparent}
.opt[data-n="1"].on{background:var(--n1);color:var(--t1)}.opt[data-n="2"].on{background:var(--n2);color:var(--t2)}.opt[data-n="3"].on{background:var(--n3);color:var(--t3)}.opt[data-n="4"].on{background:var(--n4);color:var(--t4)}.opt[data-n="5"].on{background:var(--n5);color:var(--t5)}
.internal{background:var(--warn);border-radius:10px;padding:12px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:520px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:600;font-size:14px}
details{margin-top:14px;color:var(--mute)}
details ul{margin:8px 0 0;padding-left:18px}
.empty{text-align:center;padding:48px 20px;color:var(--mute)}
svg text{fill:var(--mute);font-size:12px}
header{border-bottom:4px solid;border-image:linear-gradient(90deg,#1A3DFF 0 34%,#00C800 34% 67%,#FFD100 67% 100%) 1}
.logo{height:76px;width:auto;background:#fff;border-radius:10px;padding:4px 8px}
@media(max-width:800px){.wrap{grid-template-columns:1fr;padding:14px}aside{flex-direction:row;flex-wrap:wrap}.pi{width:auto}}
@media print{:root[data-theme]{--panel:#fff;--bg:#fff;--ink:#000;--mute:#555;--line:#ccc}header{background:none;border:none;border-image:none;padding:0 0 12px}header .btn,#st,aside,.noprint{display:none!important}.wrap{display:block;padding:0}section{break-inside:avoid;border:none;padding:8px 0}body{background:#fff;color:#000}}
</style>
</head>

<script>
const N=['','Insuficiente','Abaixo do esperado','Satisfatório','Bom','Excelente'];
const D=['','Não avançou ou não respondeu ao desafio','Avanço pontual, com lacunas relevantes','Cumpriu o mínimo esperado','Cumpriu com qualidade e alguma proatividade','Superou o esperado'];
const AT=['Sim','Parcialmente','Não'];
const MS=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
let list=[],sel=null,mes=null,show=false,db=null,timer=null;
const $=s=>document.querySelector(s);
const E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ml=m=>{const[y,n]=m.split('-');return MS[n-1]+'/'+y.slice(2)};
const cur=()=>list.find(p=>p.id===sel);
const curC=()=>{const p=cur();return p&&p.ciclos.find(c=>c.mes===mes)};
const setSt=t=>{$('#st').textContent=t};

async function persist(p){
  try{
    if(db){await db.doc('participantes/'+p.id).set(p);setSt('Salvo')}
    else{localStorage.setItem('dossies',JSON.stringify(list));setSt('Salvo só neste navegador')}
  }catch(e){setSt('Não foi possível salvar. Confira se você tem permissão de edição.')}
}
function queue(p){setSt('Salvando…');clearTimeout(timer);timer=setTimeout(()=>persist(p),600)}

function F(label,scope,key,val,o={}){
  if(show){
    if(o.internal)return'';
    return`<div class="f ${o.w?'w':''}"><b>${label}</b><p>${E(val)||'<i>Sem registro</i>'}</p></div>`;
  }
  const a=scope==='k'?`data-k="${key}"`:`data-c="${key}"`;
  const inner=o.ta?`<textarea rows="${o.rows||3}" ${a}>${E(val)}</textarea>`:`<input type="${o.type||'text'}" ${a} value="${E(val)}">`;
  return`<label class="f ${o.w?'w':''}"><b>${label}</b>${o.hint?`<small>${o.hint}</small>`:''}${inner}</label>`;
}
const chip=n=>n?`<span class="chip" data-n="${n}">${n}</span>`:'<span class="chip">–</span>';
const trend=(cs,i)=>{if(i===0||!cs[i].nota||!cs[i-1].nota)return'–';const d=cs[i].nota-cs[i-1].nota;return d>0?'↑':d<0?'↓':'→'};

function spark(cs){
  const W=Math.max(300,cs.length*110),H=120;
  const x=i=>cs.length===1?W/2:36+i*(W-72)/(cs.length-1);
  const y=n=>H-32-(n-1)*(H-60)/4;
  const pts=cs.map((c,i)=>c.nota?[x(i),y(c.nota),c.nota]:null);
  const line=pts.filter(Boolean).map(p=>p[0]+','+p[1]).join(' ');
  return`<div class="scroll"><svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Notas por mês">
  <polyline points="${line}" fill="none" stroke="var(--acc)" stroke-width="2"/>
  ${pts.map((p,i)=>p?`<circle cx="${p[0]}" cy="${p[1]}" r="5" fill="var(--acc)"/><text x="${p[0]}" y="${p[1]-10}" text-anchor="middle">${p[2]}</text>`:'').join('')}
  ${cs.map((c,i)=>`<text x="${x(i)}" y="${H-8}" text-anchor="middle">${ml(c.mes)}</text>`).join('')}</svg></div>`;
}

function render(){
  $('#modeb').textContent=show?'Voltar para edição':'Modo apresentação';
  $('#modeb').classList.toggle('on',show);
  if(!list.find(p=>p.id===sel))sel=list[0]?.id||null;
  $('#side').innerHTML=list.map(p=>{
    const cs=p.ciclos,l=cs.length?cs[cs.length-1].nota:0;
    return`<button class="pi ${p.id===sel?'sel':''}" data-act="sel" data-id="${p.id}"><span>${E(p.ident.nome)||'Sem nome'}</span>${chip(l)}</button>`;
  }).join('')+(show?'':`<button class="btn pri noprint" data-act="addp">Adicionar participante</button>`);
  const p=cur(),m=$('#main');
  if(!p){m.innerHTML=`<section class="empty">Nenhum participante ainda.<br>Adicione o primeiro para começar o dossiê.</section>`;return}
  p.ciclos.sort((a,b)=>a.mes.localeCompare(b.mes));
  const cs=p.ciclos;
  if(!cs.find(c=>c.mes===mes))mes=cs.length?cs[cs.length-1].mes:null;
  const c=curC(),i=p.ident;
  let h=`<section>${show?`<h2 style="font-size:28px">${E(i.nome)}</h2>`:`<input class="name" data-k="nome" value="${E(i.nome)}" aria-label="Nome do participante" placeholder="Nome do participante">`}
  <div class="grid" style="margin-top:12px">
  ${F('Responsável de contato','k','contato',i.contato)}
  ${F('Data de entrada no sandbox','k','entrada',i.entrada,{type:'date'})}
  ${F('Solução ou projeto testado','k','solucao',i.solucao,{w:1})}
  ${F('Objetivo no sandbox','k','objetivo',i.objetivo,{ta:1,w:1,hint:'O que o participante quer validar ou aprender.'})}
  ${F('Ponto de partida','k','partida',i.partida,{ta:1,w:1,hint:'Situação e maturidade na entrada.'})}
  </div></section>`;
  h+=`<section><h2>Evolução</h2>`;
  if(!cs.length)h+=`<p class="f"><i style="color:var(--mute)">Ainda não há ciclos registrados.</i></p>`;
  else h+=spark(cs)+`<div class="scroll"><table><tr><th>Mês</th><th>Desafio</th><th>Nota</th><th>Atendeu à expectativa?</th><th>Tendência</th></tr>
  ${cs.map((x,j)=>`<tr><td>${ml(x.mes)}</td><td>${E((x.desafio||'').slice(0,90))}${(x.desafio||'').length>90?'…':''}</td><td>${chip(x.nota)} ${N[x.nota]||''}</td><td>${E(x.atendeu)||'–'}</td><td>${trend(cs,j)}</td></tr>`).join('')}</table></div>`;
  h+=`</section><section><h2>Ciclo mensal</h2><div class="tabs">${cs.map(x=>`<button class="opt ${x.mes===mes?'on':''}" data-act="mes" data-m="${x.mes}">${ml(x.mes)}</button>`).join('')}${show?'':`<button class="btn noprint" data-act="addc">Novo mês</button>`}</div>`;
  if(c){
    h+=`<div class="grid">
    ${F('Encontros realizados','c','encontros',c.encontros,{hint:'Quantidade e datas.'})}
    <div class="f"><b>Presença e engajamento</b>${optRow('eng',['Alto','Médio','Baixo'],c.eng)}</div>
    ${F('Dores enfrentadas','c','dores',c.dores,{ta:1,w:1,rows:4,hint:'Dificuldades técnicas, regulatórias, de negócio, de equipe ou de recursos.'})}
    ${F('Desafio proposto','c','desafio',c.desafio,{ta:1,w:1,hint:'O desafio definido para o mês e o resultado esperado.'})}
    ${F('Resposta ao desafio','c','resposta',c.resposta,{ta:1,w:1,rows:4,hint:'O que fez, entregou ou testou, com as evidências.'})}
    <div class="f w"><b>Nota do mês (1 a 5)</b><div class="opts">${[1,2,3,4,5].map(n=>`<button class="opt ${c.nota===n?'on':''}" data-n="${n}" data-act="nota" data-v="${n}" ${show?'disabled':''}>${n} · ${N[n]}</button>`).join('')}</div>
    <details><summary>O que significa cada nota</summary><ul>${[1,2,3,4,5].map(n=>`<li><b>${n}, ${N[n]}:</b> ${D[n]}</li>`).join('')}</ul></details></div>
    <div class="f w"><b>Atendeu à expectativa?</b>${optRow('atendeu',AT,c.atendeu)}</div>
    ${F('Justificativa','c','justificativa',c.justificativa,{ta:1,w:1,rows:4,hint:'Por que essa nota? Se ficou abaixo do esperado, qual foi a causa? A expectativa estava calibrada?'})}
    ${F('Principais aprendizados do mês','c','aprend',c.aprend,{ta:1,w:1})}
    ${F('Próximo desafio proposto','c','proximo',c.proximo,{ta:1,w:1,hint:'Descrição, resultado esperado e prazo.'})}
    ${show?'':`<div class="f w internal"><b>Nota interna</b><small>Não aparece no modo apresentação nem na impressão em modo apresentação.</small><textarea rows="3" data-c="interno">${E(c.interno)}</textarea></div>`}
    </div>`;
  }else h+=`<p style="color:var(--mute)">Crie o primeiro mês para registrar dores, desafio e nota.</p>`;
  h+=`</section>`;
  if(!show)h+=`<div class="noprint"><button class="btn danger" data-act="delp" id="delb">Excluir este participante</button></div>`;
  m.innerHTML=h;
}
function optRow(key,vals,v){
  return`<div class="opts">${vals.map(x=>`<button class="opt ${v===x?'on':''}" data-act="opt" data-key="${key}" data-v="${x}" ${show?'disabled':''}>${x}</button>`).join('')}</div>`;
}
function nextMonth(){
  const cs=cur().ciclos;
  if(!cs.length)return new Date().toISOString().slice(0,7);
  let[y,n]=cs[cs.length-1].mes.split('-').map(Number);n++;if(n>12){n=1;y++}
  return y+'-'+String(n).padStart(2,'0');
}
document.addEventListener('input',e=>{
  const t=e.target,p=cur();if(!p)return;
  if(t.dataset.k!==undefined)p.ident[t.dataset.k]=t.value;
  else if(t.dataset.c!==undefined){const c=curC();if(c)c[t.dataset.c]=t.value}
  else return;
  queue(p);
});
document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act,p=cur();
  if(a==='theme')theme(document.documentElement.dataset.theme==='dark'?'light':'dark');
  else if(a==='mode'){show=!show;render()}
  else if(a==='print')window.print();
  else if(a==='sel'){sel=b.dataset.id;mes=null;render()}
  else if(a==='mes'){mes=b.dataset.m;render()}
  else if(a==='addp'){
    const np={id:'p'+Date.now().toString(36),ident:{nome:'Novo participante',contato:'',entrada:'',solucao:'',objetivo:'',partida:''},ciclos:[]};
    list.push(np);sel=np.id;mes=null;render();persist(np);
  }
  else if(a==='addc'){
    const m=nextMonth();
    p.ciclos.push({mes:m,encontros:'',eng:'',dores:'',desafio:'',resposta:'',nota:0,atendeu:'',justificativa:'',aprend:'',proximo:'',interno:''});
    mes=m;render();persist(p);
  }
  else if(a==='nota'||a==='opt'){
    const c=curC();if(!c)return;
    if(a==='nota')c.nota=c.nota===+b.dataset.v?0:+b.dataset.v;
    else c[b.dataset.key]=c[b.dataset.key]===b.dataset.v?'':b.dataset.v;
    render();persist(p);
  }
  else if(a==='delp'){
    if(b.dataset.ok!=='1'){b.dataset.ok='1';b.textContent='Clique de novo para confirmar a exclusão';return}
    list=list.filter(x=>x.id!==p.id);
    try{if(db)await db.doc('participantes/'+p.id).delete();else localStorage.setItem('dossies',JSON.stringify(list))}catch(err){setSt('Não foi possível excluir')}
    sel=null;render();
  }
});
function theme(t){document.documentElement.dataset.theme=t;try{localStorage.setItem('tema',t)}catch(e){}$('#themeb').textContent=t==='dark'?'Modo claro':'Modo escuro'}
(async function init(){theme(document.documentElement.dataset.theme||'light');
  try{db=await window.claude?.use('db')}catch(e){db=null}
  if(db){
    db.collection('participantes').onSnapshot(s=>{
      if(document.activeElement&&/INPUT|TEXTAREA/.test(document.activeElement.tagName))return;
      list=s.docs.map(d=>d.data()).filter(Boolean).map(x=>JSON.parse(JSON.stringify(x))).sort((a,b)=>(a.ident.nome||'').localeCompare(b.ident.nome||''));
      render();
    },()=>setSt('Sem conexão com os dados compartilhados'));
    setSt('Dados compartilhados com a equipe');
  }else{
    try{list=JSON.parse(localStorage.getItem('dossies')||'[]')}catch(e){list=[]}
    setSt('Salvo só neste navegador');
  }
  render();
})();
</script>
</body>
</html>
